name: H3 Specs
on:
  push:
    branches: [docs/giuliano-elementos-compartidos]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h3-specs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python scripts/check-h3-links.py
